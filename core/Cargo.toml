[package]
name = "harness_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[dependencies]
anyhow = "1"
jni = "0.21"
# Release 0.1.161 on crates.io bundles a llama.cpp without the `lfm3` arch;
# pin the git revision whose llama.cpp submodule supports it.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", default-features = false, features = ["android-static-stdcxx"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
